# Platform + Caddy (HTTPS). Edit deploy/Caddyfile (domain) and .env first.
services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../.env
    volumes:
      - fxdata:/app/data
      - fxlogs:/app/logs
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped
volumes:
  fxdata: {}
  fxlogs: {}
  caddy_data: {}
